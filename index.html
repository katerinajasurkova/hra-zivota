<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>The Game of Life</title>
    <script src="code.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="gridContainer"></div>

    <div class="controls">
      <button id="start">start</button>
      <button id="clear">clear</button>
      <button id="random">random</button>
    </div>
    
    <div class="settings">
  <label>
    Rychlost (ms):
    <input type="range" id="speed" min="100" max="2000" step="100" value="1000">
  </label>

  <label>
    Velikost pole:
    <input type="number" id="size" min="5" max="50" value="15">
    <button id="resize">změnit</button>
  </label>

  <label>
    Pravidla (např. B3/S23):
    <input type="text" id="rules" value="B3/S23">
  </label>

  <div id="counter">Živé buňky: 0</div>
</div>

<footer>
        <p>
                <a href="https://validator.w3.org/nu/?doc=https%3A%2F%2Fkaterinajasurkova.github.io%2Fhra-zivota%2F" target="_blank"><img src="https://www.w3.org/Icons/valid-html20-blue" alt="Ověřit HTML"></a>
                
                <a href="https://jigsaw.w3.org/css-validator/validator?uri=https%3A%2F%2Fkaterinajasurkova.github.io%2Fhra-zivota%2F&profile=css3svg&usermedium=all&warning=1&vextwarning=&lang=cs" target="_blank"><img style="border:0;width:88px;height:31px" src="https://jigsaw.w3.org/css-validator/images/vcss-blue" alt="Ověřit CSS!" /></a>
        </p>
    </footer>

  </body>
</html>
